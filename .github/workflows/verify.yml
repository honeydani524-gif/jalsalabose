name: Verify and build Android APK

on:
  push:
    branches:
      - "audit/**"
      - "fix/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Financial regression tests
        run: npm test

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production web build
        run: npm run build

      - name: Setup Java
        if: hashFiles('capacitor.config.ts') != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        if: hashFiles('capacitor.config.ts') != ''
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        if: hashFiles('capacitor.config.ts') != ''
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Generate Capacitor Android project
        if: hashFiles('capacitor.config.ts') != ''
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build debug APK
        if: hashFiles('capacitor.config.ts') != ''
        run: cd android && ./gradlew assembleDebug

      - name: Upload debug APK
        if: hashFiles('capacitor.config.ts') != ''
        uses: actions/upload-artifact@v4
        with:
          name: jalsalabose-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
