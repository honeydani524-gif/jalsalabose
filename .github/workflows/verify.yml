name: Baseline verification

on:
  push:
    branches:
      - "audit/**"
      - "fix/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Financial regression tests
        run: npm test
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
